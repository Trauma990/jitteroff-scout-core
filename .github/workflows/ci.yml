name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.404
      - run: dotnet restore --locked-mode
      - run: dotnet build --no-restore --configuration Release -p:ScoutCommit=${{ github.sha }}
      - run: dotnet test --no-restore --configuration Release -p:ScoutCommit=${{ github.sha }}
